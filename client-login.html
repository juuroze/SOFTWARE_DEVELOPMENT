<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuriSync - Client Portal</title>
    <link rel="stylesheet" href="style.css">
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="brand-wrapper">
            <img src="logo11.png" alt="JuriSync Logo" class="brand-logo-login">
        </div>
        <h2>JuriSync Client Portal</h2>
        <p>Sign in to view your case and message your lawyer</p>

        <form id="client-login-form" autocomplete="off">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="client-email" placeholder="you@example.com" required autocomplete="off">
            </div>

            <button type="submit" class="btn-login">Send Me a Login Link</button>

            <div class="login-footer" id="client-login-status" style="margin-top: 15px;">
                We'll email you a secure link — no password needed.
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://qksgqkmctjzmzhzmrbhj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Hx1bN74JlwOKBW6wv0wRgQ_fkP9N-b5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('client-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('client-email').value.trim();
            const loginBtn = document.querySelector('.btn-login');
            const statusEl = document.getElementById('client-login-status');

            loginBtn.disabled = true;
            loginBtn.innerText = 'Sending...';

            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    emailRedirectTo: window.location.origin + window.location.pathname.replace('client-login.html', '') + 'client-portal.html',
                    shouldCreateUser: false
                }
            });

            if (error) {
                statusEl.style.color = '#ef4444';
                statusEl.innerText = "Couldn't send login link: " + error.message + '. If you\'re a new client, ask your lawyer to add you first.';
                loginBtn.disabled = false;
                loginBtn.innerText = 'Send Me a Login Link';
                return;
            }

            statusEl.style.color = '#16a34a';
            statusEl.innerText = 'Check your email for a login link. You can close this tab.';
            loginBtn.innerText = 'Link Sent';
        });
    </script>
</body>
</html>
