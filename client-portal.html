<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuriSync - Your Case</title>
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >
    <script>
        (function () {
            if (/(^|[#&])(access_token|refresh_token|error|error_code|type)=/.test(window.location.hash)) {
                window.location.replace('client-login.html' + window.location.hash);
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p-navy: #0f172a;
            --p-navy-2: #1e293b;
            --p-blue: #3b82f6;
            --p-blue-dark: #2563eb;
            --p-text: #0f172a;
            --p-muted: #64748b;
            --p-line: #e2e8f0;
            --p-bg: #f1f5f9;
            --p-card: #ffffff;
        }
        body.portal-body {
            background: var(--p-bg);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            color: var(--p-text);
        }
        .p-header {
            background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
            color: #fff;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .p-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .p-logo { width: 38px; height: auto; flex: 0 0 auto; }
        .p-brand strong { display: block; font-size: 17px; line-height: 1.2; letter-spacing: -0.2px; }
        .p-brand span { display: block; font-size: 12px; color: #94a3b8; }
        .p-user { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .p-user-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .p-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--p-blue); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; flex: 0 0 auto;
        }
        .p-avatar.sm { width: 32px; height: 32px; font-size: 12px; }
        .p-avatar.soft { background: #dbeafe; color: var(--p-blue-dark); }
        .p-logout {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(148,163,184,0.25);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px;
            transition: background-color 0.2s ease;
        }
        .p-logout:hover { background: rgba(248,113,113,0.16); color: #fecaca; }
        .p-logout:focus-visible, .p-case:focus-visible, .c-send:focus-visible, .p-retry:focus-visible {
            outline: 2px solid #60a5fa; outline-offset: 2px;
        }
        .p-main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 40px; }
        .p-greet h1 { font-size: 26px; margin: 0; letter-spacing: -0.4px; }
        .p-greet p { margin: 4px 0 22px; color: var(--p-muted); font-size: 14px; }
        .p-shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
        .p-cases { display: flex; flex-direction: column; gap: 10px; }
        .p-section-title { font-size: 14px; font-weight: 700; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; color: var(--p-navy-2); }
        .p-count { background: #e2e8f0; color: #475569; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
        .p-case-list { display: flex; flex-direction: column; gap: 10px; }
        .p-case {
            text-align: left; width: 100%;
            background: var(--p-card); border: 1px solid var(--p-line); border-radius: 14px;
            padding: 14px 16px; cursor: pointer; font: inherit; color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .p-case:hover { border-color: #bfdbfe; }
        .p-case.active { border-color: var(--p-blue); box-shadow: 0 6px 18px -8px rgba(59,130,246,0.45); }
        .p-case.active::before {
            content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px;
            border-radius: 0 4px 4px 0; background: var(--p-blue);
        }
        .p-case-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .p-case h3 { margin: 0; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
        .p-case-sub { margin: 6px 0 0; font-size: 12px; color: var(--p-muted); line-height: 1.5; }
        .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; text-transform: capitalize; white-space: nowrap; }
        .pill.active { background: #dcfce7; color: #16a34a; }
        .pill.closed { background: #f1f5f9; color: #64748b; }
        .p-convo {
            background: var(--p-card); border: 1px solid var(--p-line); border-radius: 18px;
            display: flex; flex-direction: column; overflow: hidden;
            height: calc(100vh - 190px); min-height: 520px;
        }
        .c-head {
            padding: 16px 22px; border-bottom: 1px solid var(--p-line);
            display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .c-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.2px; overflow-wrap: anywhere; }
        .c-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--p-muted); }
        .c-meta .chip { background: #f1f5f9; border-radius: 99px; padding: 3px 10px; font-weight: 600; color: #475569; }
        .c-lawyer { display: flex; align-items: center; gap: 10px; }
        .c-lawyer strong { display: block; font-size: 13px; }
        .c-lawyer span { display: block; font-size: 12px; color: var(--p-muted); }
        .c-thread {
            flex: 1; overflow-y: auto; padding: 20px 22px;
            background: #f8fafc; display: flex; flex-direction: column; gap: 6px;
            scroll-behavior: smooth;
        }
        .c-thread:focus-visible { outline: 2px solid #93c5fd; outline-offset: -2px; }
        .c-day { align-self: center; font-size: 12px; font-weight: 600; color: #64748b; background: #e2e8f0; padding: 3px 12px; border-radius: 99px; margin: 12px 0 8px; }
        .c-row { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
        .c-row.mine { flex-direction: row-reverse; }
        .c-bubble-wrap { max-width: min(78%, 560px); display: flex; flex-direction: column; gap: 4px; }
        .c-row.mine .c-bubble-wrap { align-items: flex-end; }
        .c-who { font-size: 12px; font-weight: 600; color: #475569; padding: 0 4px; }
        .c-bubble {
            padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.55;
            overflow-wrap: anywhere; white-space: pre-wrap;
        }
        .c-row.theirs .c-bubble { background: #fff; border: 1px solid var(--p-line); border-bottom-left-radius: 5px; }
        .c-row.mine .c-bubble { background: var(--p-blue-dark); color: #fff; border-bottom-right-radius: 5px; }
        .c-subject { display: block; font-weight: 700; margin-bottom: 4px; }
        .c-attach {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 8px;
            padding: 7px 12px; border-radius: 10px; background: #eff6ff; border: 1px solid #bfdbfe;
            color: var(--p-blue-dark); font-size: 12px; font-weight: 600; text-decoration: none;
            max-width: 100%; white-space: normal; overflow-wrap: anywhere;
        }
        .c-attach:hover { background: #dbeafe; }
        .c-time { font-size: 11px; color: #94a3b8; padding: 0 4px; }
        .c-empty, .c-state { margin: auto; text-align: center; color: var(--p-muted); max-width: 320px; padding: 20px; }
        .c-empty i, .c-state i { font-size: 30px; color: #93c5fd; margin-bottom: 12px; }
        .c-empty strong, .c-state strong { display: block; color: var(--p-text); margin-bottom: 4px; font-size: 15px; }
        .c-state.error i { color: #f87171; }
        .p-retry {
            margin-top: 12px; background: var(--p-navy); color: #fff; border: none;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
        }
        .c-skel { height: 54px; border-radius: 16px; background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: cshimmer 1.3s infinite; width: 60%; }
        .c-skel.right { align-self: flex-end; width: 45%; }
        @keyframes cshimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .c-composer { border-top: 1px solid var(--p-line); padding: 12px 16px 10px; background: #fff; }
        .c-form { display: flex; gap: 10px; align-items: flex-end; }
        .c-input {
            flex: 1; resize: none; border: 1px solid #cbd5e1; border-radius: 14px;
            padding: 11px 14px; font: inherit; font-size: 14px; line-height: 1.5;
            max-height: 140px; min-height: 44px; box-sizing: border-box;
        }
        .c-input:focus { outline: none; border-color: var(--p-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .c-send {
            width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer;
            background: var(--p-blue-dark); color: #fff; font-size: 15px; flex: 0 0 auto;
            transition: background-color 0.2s ease;
        }
        .c-send:hover:not(:disabled) { background: #1d4ed8; }
        .c-send:disabled { background: #cbd5e1; cursor: not-allowed; }
        .c-hint { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-top: 6px; padding: 0 4px; }
        .c-hint .warn { color: #dc2626; font-weight: 600; }
        .c-note { padding: 14px 20px; border-top: 1px solid var(--p-line); font-size: 13px; color: var(--p-muted); display: flex; align-items: center; gap: 10px; background: #fff; }
        .c-formerr { color: #dc2626; font-size: 12px; margin: 6px 4px 0; min-height: 0; }
        .p-empty-all { background: #fff; border: 1px solid var(--p-line); border-radius: 18px; padding: 48px 24px; text-align: center; color: var(--p-muted); }
        .p-empty-all i { font-size: 34px; color: #93c5fd; margin-bottom: 14px; }
        .p-boot { text-align: center; color: var(--p-muted); margin-top: 80px; }
        @media (max-width: 900px) {
            .p-header { padding: 10px 16px; }
            .p-user-name { display: none; }
            .p-main { padding: 20px 14px 28px; }
            .p-shell { grid-template-columns: 1fr; }
            .p-case-list { flex-direction: row; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
            .p-case { min-width: 250px; width: 250px; scroll-snap-align: start; }
            .p-convo { height: auto; min-height: 0; max-height: none; }
            .c-thread { min-height: 320px; max-height: 60vh; }
            .c-bubble-wrap { max-width: 86%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .c-thread { scroll-behavior: auto; }
            .c-skel { animation: none; }
            .p-case, .c-send, .p-logout { transition: none; }
        }

        .p-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 18px 0 20px; }
        .p-stat {
            display: flex; align-items: center; gap: 14px; min-width: 0;
            background: var(--p-card); border: 1px solid var(--p-line); border-radius: 16px;
            padding: 16px 18px; text-align: left; font: inherit; color: inherit;
        }
        button.p-stat { cursor: pointer; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        button.p-stat:hover:not(:disabled) { border-color: #bfdbfe; box-shadow: 0 6px 18px -10px rgba(59,130,246,0.45); }
        button.p-stat:disabled { cursor: default; }
        .p-stat-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 auto; }
        .p-stat-icon.blue { background: #dbeafe; color: #2563eb; }
        .p-stat-icon.green { background: #dcfce7; color: #16a34a; }
        .p-stat-icon.slate { background: #f1f5f9; color: #475569; }
        .p-stat-icon.amber { background: #fef3c7; color: #d97706; }
        .p-stat-body { min-width: 0; }
        .p-stat-num { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
        .p-stat-num.sm { font-size: 15px; letter-spacing: 0; }
        .p-stat-label { font-size: 12px; color: var(--p-muted); margin-top: 2px; overflow-wrap: anywhere; }

        .c-tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--p-line); background: #fff; overflow-x: auto; }
        .c-tab {
            padding: 12px 14px; border: none; border-bottom: 2px solid transparent; background: transparent;
            color: var(--p-muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .c-tab:hover { color: var(--p-text); }
        .c-tab.active { color: var(--p-blue-dark); border-bottom-color: var(--p-blue-dark); }
        .c-tab:focus-visible, button.p-stat:focus-visible, .o-link-btn:focus-visible, .h-more summary:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
        .c-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .c-scroll { flex: 1; overflow-y: auto; padding: 20px 22px; background: #f8fafc; display: flex; flex-direction: column; gap: 14px; }

        .o-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .o-card { background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
        .o-label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--p-muted); }
        .o-big { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; overflow-wrap: anywhere; }
        .o-big.muted { font-size: 17px; color: #94a3b8; }
        .o-sub { margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--p-muted); overflow-wrap: anywhere; }
        .o-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 13px; }
        .o-facts dt { color: var(--p-muted); }
        .o-facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
        .o-update-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
        .o-text { margin-top: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
        .o-link-btn { margin-top: 12px; padding: 0; background: none; border: none; color: var(--p-blue-dark); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
        .o-link-btn:hover { text-decoration: underline; }
        .pill-soft { display: inline-block; padding: 3px 10px; border-radius: 99px; background: #eff6ff; color: #2563eb; font-size: 11px; font-weight: 700; white-space: nowrap; }

        .h-timeline { position: relative; }
        .h-timeline::before { content: ""; position: absolute; left: 16px; top: 8px; bottom: 8px; width: 2px; background: var(--p-line); }
        .h-item { position: relative; display: flex; gap: 14px; padding-bottom: 16px; }
        .h-item:last-child { padding-bottom: 0; }
        .h-dot {
            position: relative; z-index: 1; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #fff; border: 2px solid #cbd5e1; color: #64748b; font-size: 12px;
        }
        .h-dot.report { border-color: var(--p-blue); color: var(--p-blue); }
        .h-card { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 14px 16px; }
        .h-card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .h-title { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
        .h-date { margin-top: 3px; font-size: 12px; color: #94a3b8; }
        .h-line { flex: 1; min-width: 0; padding-top: 7px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
        .h-line .h-title { font-weight: 600; }
        .h-line .h-date { margin-top: 0; }
        .h-meta { margin-top: 8px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
        .h-more { margin-top: 10px; }
        .h-more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--p-blue-dark); }
        .h-label { margin: 10px 0 3px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--p-muted); }
        .h-pre { font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
        .h-note { padding: 10px 14px; border-radius: 12px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-size: 13px; margin-bottom: 14px; }

        @media (max-width: 900px) {
            .p-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .o-grid { grid-template-columns: 1fr; }
            .c-scroll { overflow: visible; }
        }
        @media (max-width: 480px) {
            .p-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="portal-body">
    <header class="p-header">
        <div class="p-brand">
            <img src="logo11.png" alt="" class="p-logo">
            <div>
                <strong>JuriSync</strong>
                <span>Client Portal</span>
            </div>
        </div>
        <div class="p-user">
            <span class="p-avatar" id="p-avatar" aria-hidden="true"></span>
            <span class="p-user-name" id="p-username"></span>
            <button class="p-logout" id="portal-logout-btn" type="button"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <main class="p-main" id="portal-container">
        <p class="p-boot">Loading your account...</p>
    </main>

    <script>
        const SUPABASE_URL = 'https://qksgqkmctjzmzhzmrbhj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Hx1bN74JlwOKBW6wv0wRgQ_fkP9N-b5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const MAX_MESSAGE_LENGTH = 2000;
        const POLL_MS = 30000;

        const container = document.getElementById('portal-container');
        const state = {
            client: null,
            userId: null,
            cases: [],
            activeId: null,
            tab: 'overview',
            updates: [],
            updatesSig: '',
            updatesFailed: false,
            draft: '',
            items: [],
            signature: '',
            pollTimer: null,
            loadToken: 0
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function initials(name) {
            const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (parts.length === 0) return '?';
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function formatTime(iso) {
            return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function dayKey(iso) {
            const d = new Date(iso);
            return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        }

        function dayLabel(iso) {
            const d = new Date(iso);
            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            if (dayKey(iso) === dayKey(today.toISOString())) return 'Today';
            if (dayKey(iso) === dayKey(yesterday.toISOString())) return 'Yesterday';
            return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
        }

        document.addEventListener('click', async (e) => {
            const el = e.target.closest('[data-doc-path]');
            if (!el) return;
            e.preventDefault();
            const popup = window.open('about:blank', '_blank');
            const { data, error } = await supabaseClient.storage.from('documents').createSignedUrl(el.dataset.docPath, 300);
            if (error || !data) {
                if (popup) popup.close();
                alert('Could not open this file.');
                return;
            }
            if (popup) {
                popup.opener = null;
                popup.location.href = data.signedUrl;
            }
        });

        const IDLE_LIMIT_MS = 30 * 60 * 1000;
        const IDLE_KEY = 'jurisync-client-last-activity';

        function readLastActivity() {
            try { return Number(localStorage.getItem(IDLE_KEY)) || 0; } catch (e) { return 0; }
        }

        function idleExpired() {
            const last = readLastActivity();
            return last > 0 && Date.now() - last > IDLE_LIMIT_MS;
        }

        async function signOutForInactivity() {
            clearInterval(state.pollTimer);
            await supabaseClient.auth.signOut();
            try {
                localStorage.removeItem(IDLE_KEY);
                localStorage.setItem('jurisync-client-login-notice', 'You were signed out after 30 minutes of inactivity.');
            } catch (e) {}
            window.location.href = 'client-login.html';
        }

        function setupIdleTimeout() {
            let lastWrite = 0;
            const touch = () => {
                const now = Date.now();
                if (now - lastWrite < 15000) return;
                lastWrite = now;
                try { localStorage.setItem(IDLE_KEY, String(now)); } catch (e) {}
            };
            ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => window.addEventListener(evt, touch, { passive: true }));
            touch();

            const check = () => { if (idleExpired()) signOutForInactivity(); };
            setInterval(check, 30000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
        }

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = 'client-login.html';
                return;
            }

            const { data: aal } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
            if (!aal || aal.currentLevel !== 'aal2') {
                window.location.href = 'client-login.html';
                return;
            }

            if (idleExpired()) {
                await signOutForInactivity();
                return;
            }

            state.userId = session.user.id;

            setupIdleTimeout();

            await supabaseClient.rpc('link_my_client_account');

            const { data: client } = await supabaseClient
                .from('clients')
                .select('*')
                .eq('auth_user_id', session.user.id)
                .maybeSingle();

            if (!client) {
                container.innerHTML = `
                    <div class="p-empty-all">
                        <i class="fa-solid fa-circle-exclamation" style="color:#f59e0b;"></i>
                        <p>We couldn't find an approved client record linked to <strong>${escapeHtml(session.user.email)}</strong>.</p>
                        <p style="font-size:13px;">Please contact your lawyer to confirm you've been added as a client.</p>
                    </div>`;
                return;
            }

            state.client = client;
            document.getElementById('p-avatar').textContent = initials(client.client_name);
            document.getElementById('p-username').textContent = client.client_name || '';
            await loadCases();
        }

        async function loadCases() {
            const { data: cases, error } = await supabaseClient.rpc('portal_my_cases');

            if (error) {
                container.innerHTML = `
                    <div class="p-empty-all">
                        <i class="fa-solid fa-triangle-exclamation" style="color:#f87171;"></i>
                        <p>We couldn't load your cases: ${escapeHtml(error.message)}</p>
                        <button class="p-retry" type="button" id="retry-cases">Try again</button>
                    </div>`;
                document.getElementById('retry-cases').addEventListener('click', loadCases);
                return;
            }

            state.cases = cases || [];
            const firstName = String(state.client.client_name || '').trim().split(/\s+/)[0] || 'there';

            if (state.cases.length === 0) {
                container.innerHTML = `
                    <div class="p-greet"><h1>Welcome, ${escapeHtml(firstName)}</h1></div>
                    <div class="p-empty-all">
                        <i class="fa-regular fa-folder-open"></i>
                        <p><strong style="color:#0f172a;">No cases on file yet</strong></p>
                        <p style="font-size:13px;">When your lawyer opens a case for you, it will show up here.</p>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="p-greet">
                    <h1>Welcome back, ${escapeHtml(firstName)}</h1>

                </div>
                <div class="p-stats" id="p-stats" aria-label="Your cases at a glance"></div>
                <div class="p-shell">
                    <aside class="p-cases" aria-label="Your cases">
                        <h2 class="p-section-title">Your cases <span class="p-count">${state.cases.length}</span></h2>
                        <div class="p-case-list" id="case-list"></div>
                    </aside>
                    <section class="p-convo" id="convo" aria-label="Conversation"></section>
                </div>`;

            await loadUpdates();
            renderStats();
            document.getElementById('p-stats').addEventListener('click', (e) => {
                const card = e.target.closest('[data-case-id]');
                if (card) openCase(card.getAttribute('data-case-id'));
            });

            document.getElementById('case-list').addEventListener('click', (e) => {
                const card = e.target.closest('[data-case-id]');
                if (card) openCase(card.getAttribute('data-case-id'));
            });

            const keep = state.cases.find(c => String(c.id) === String(state.activeId));
            openCase(keep ? keep.id : state.cases[0].id);
        }

        function renderCaseList() {
            const listEl = document.getElementById('case-list');
            if (!listEl) return;
            listEl.innerHTML = state.cases.map(c => {
                const lawyerName = c.lead_lawyer ? `Atty. ${escapeHtml(c.lead_lawyer)}` : 'Lawyer not assigned yet';
                const status = c.status === 'closed' ? 'closed' : 'active';
                const active = String(c.id) === String(state.activeId);
                return `
                    <button type="button" class="p-case ${active ? 'active' : ''}" data-case-id="${escapeHtml(c.id)}" aria-pressed="${active}">
                        <div class="p-case-top">
                            <h3>${escapeHtml(c.title)}</h3>
                            <span class="pill ${status}">${escapeHtml(status)}</span>
                        </div>
                        <p class="p-case-sub">${c.case_number ? '#' + escapeHtml(c.case_number) + ' • ' : ''}${escapeHtml(c.case_type || 'General')}<br>${lawyerName}</p>
                    </button>`;
            }).join('');
        }

        function activeCase() {
            return state.cases.find(c => String(c.id) === String(state.activeId)) || null;
        }

        function openCase(caseId) {
            state.activeId = caseId;
            state.items = [];
            state.signature = '';
            renderCaseList();

            const c = activeCase();
            const convo = document.getElementById('convo');
            if (!c || !convo) return;

            const lawyer = c.lead_lawyer ? `Atty. ${escapeHtml(c.lead_lawyer)}` : 'Your legal team';
            const status = c.status === 'closed' ? 'closed' : 'active';

            convo.innerHTML = `
                <div class="c-head">
                    <div>
                        <h2>${escapeHtml(c.title)}</h2>
                        <div class="c-meta">
                            <span class="pill ${status}">${escapeHtml(status)}</span>
                            ${c.case_number ? `<span class="chip">#${escapeHtml(c.case_number)}</span>` : ''}
                            <span class="chip">${escapeHtml(c.case_type || 'General')}</span>
                            ${c.case_stage ? `<span class="chip">${escapeHtml(c.case_stage)}</span>` : ''}
                        </div>
                    </div>
                    <div class="c-lawyer">
                        <span class="p-avatar sm soft" aria-hidden="true">${escapeHtml(initials(c.lead_lawyer || 'JS'))}</span>
                        <div><strong>${lawyer}</strong><span>${c.lead_lawyer ? 'Your lead lawyer' : 'Assignment pending'}</span></div>
                    </div>
                </div>
                <div class="c-tabs" role="tablist" aria-label="Case sections">
                    <button type="button" class="c-tab active" role="tab" data-tab="overview" aria-selected="true">Overview</button>
                    <button type="button" class="c-tab" role="tab" data-tab="history" aria-selected="false">History</button>
                    <button type="button" class="c-tab" role="tab" data-tab="messages" aria-selected="false">Messages</button>
                </div>
                <div class="c-pane" id="c-pane"></div>`;

            convo.querySelector('.c-tabs').addEventListener('click', (e) => {
                const tabBtn = e.target.closest('.c-tab');
                if (tabBtn && tabBtn.dataset.tab !== state.tab) showTab(tabBtn.dataset.tab);
            });
            convo.querySelector('#c-pane').addEventListener('click', (e) => {
                const go = e.target.closest('[data-goto]');
                if (go) showTab(go.dataset.goto);
            });

            state.tab = 'overview';
            state.draft = '';
            showTab('overview');
            startPolling();
        }

        function startPolling() {
            clearInterval(state.pollTimer);
            state.pollTimer = setInterval(async () => {
                if (document.hidden || !state.activeId) return;
                if (state.tab === 'messages') {
                    loadThread(state.activeId, true);
                    return;
                }
                const changed = await loadUpdates();
                if (!changed) return;
                renderStats();
                if (state.tab === 'overview') renderOverview();
                else if (state.tab === 'history') renderHistory();
            }, POLL_MS);
        }

        async function loadThread(caseId, silent) {
            const token = ++state.loadToken;

            const { data: rows, error } = await supabaseClient
                .from('email_queue')
                .select('*, documents(title, file_path)')
                .eq('case_id', caseId)
                .eq('is_sent', true)
                .order('sent_at', { ascending: true });

            if (token !== state.loadToken || String(caseId) !== String(state.activeId) || state.tab !== 'messages') return;

            if (error) {
                if (!silent) renderThreadError(caseId);
                return;
            }

            const items = (rows || []).map(m => ({
                key: 'e' + m.id,
                side: m.kind === 'client_message' ? 'client' : 'lawyer',
                ts: m.sent_at || m.created_at,
                subject: m.kind === 'client_message' ? '' : (m.subject || ''),
                body: m.body || '',
                doc: m.documents || null
            }));
            items.sort((a, b) => new Date(a.ts) - new Date(b.ts));

            const signature = items.map(i => i.key).join('|');
            const firstPaint = !document.getElementById('c-form') && !document.getElementById('c-footer').children.length;

            if (signature !== state.signature || firstPaint) {
                const threadEl = document.getElementById('c-thread');
                const nearBottom = threadEl ? (threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 80) : true;
                state.items = items;
                state.signature = signature;
                renderThread(nearBottom || firstPaint);
            }

            if (firstPaint) renderFooter();
        }

        function renderThreadError(caseId) {
            const threadEl = document.getElementById('c-thread');
            if (!threadEl) return;
            threadEl.innerHTML = `
                <div class="c-state error">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <strong>We couldn't load your messages</strong>
                    <span>Check your connection and try again.</span><br>
                    <button type="button" class="p-retry" id="retry-thread">Try again</button>
                </div>`;
            document.getElementById('retry-thread').addEventListener('click', () => {
                threadEl.innerHTML = '<div class="c-skel"></div><div class="c-skel right"></div>';
                loadThread(caseId, false);
            });
        }

        function renderThread(scrollToEnd) {
            const threadEl = document.getElementById('c-thread');
            if (!threadEl) return;
            const c = activeCase();
            const lawyerLabel = c && c.lead_lawyer ? `Atty. ${c.lead_lawyer}` : 'Your legal team';

            if (state.items.length === 0) {
                threadEl.innerHTML = `
                    <div class="c-empty">
                        <i class="fa-regular fa-comments"></i>
                        <strong>No messages yet</strong>
                        <span>Updates from your lawyer will appear here, and you can write back any time.</span>
                    </div>`;
                return;
            }

            let html = '';
            let lastDay = '';
            state.items.forEach(item => {
                const dk = dayKey(item.ts);
                if (dk !== lastDay) {
                    html += `<div class="c-day">${escapeHtml(dayLabel(item.ts))}</div>`;
                    lastDay = dk;
                }
                const mine = item.side === 'client';
                const attachment = item.doc
                    ? `<a href="#" class="c-attach" data-doc-path="${escapeHtml(item.doc.file_path || '')}"><i class="fa-solid fa-paperclip"></i> ${escapeHtml(item.doc.title)}</a>`
                    : '';
                const subject = item.subject && item.subject.trim() && item.subject.trim() !== item.body.trim()
                    ? `<span class="c-subject">${escapeHtml(item.subject)}</span>` : '';
                const avatar = mine ? '' : `<span class="p-avatar sm soft" aria-hidden="true">${escapeHtml(initials(c && c.lead_lawyer ? c.lead_lawyer : 'JS'))}</span>`;
                html += `
                    <div class="c-row ${mine ? 'mine' : 'theirs'}">
                        ${avatar}
                        <div class="c-bubble-wrap">
                            ${mine ? '' : `<span class="c-who">${escapeHtml(lawyerLabel)}</span>`}
                            <div class="c-bubble">${subject}${escapeHtml(item.body)}${attachment}</div>
                            <span class="c-time">${escapeHtml(formatTime(item.ts))}</span>
                        </div>
                    </div>`;
            });
            threadEl.innerHTML = html;

            if (scrollToEnd) threadEl.scrollTop = threadEl.scrollHeight;
        }

        function renderFooter() {
            const footer = document.getElementById('c-footer');
            if (!footer) return;
            const c = activeCase();

            if (c && c.status === 'closed') {
                footer.innerHTML = `<div class="c-note"><i class="fa-solid fa-lock"></i> This case is closed, so new messages are turned off.</div>`;
                return;
            }

            const target = c && c.lead_lawyer ? `Atty. ${escapeHtml(c.lead_lawyer)}` : 'your lawyer';
            footer.innerHTML = `
                <div class="c-composer">
                    <form class="c-form" id="c-form" autocomplete="off">
                        <textarea class="c-input" id="c-input" rows="1" maxlength="${MAX_MESSAGE_LENGTH}" placeholder="Write a message to ${target}" aria-label="Message"></textarea>
                        <button type="submit" class="c-send" id="c-send" aria-label="Send message" disabled><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                    <div class="c-formerr" id="c-formerr" role="alert"></div>
                    <div class="c-hint"><span>Enter to send, Shift+Enter for a new line</span><span id="c-count"></span></div>
                </div>`;

            const input = document.getElementById('c-input');
            const sendBtn = document.getElementById('c-send');
            const count = document.getElementById('c-count');

            const sync = () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 140) + 'px';
                const len = input.value.length;
                sendBtn.disabled = input.value.trim().length === 0;
                const left = MAX_MESSAGE_LENGTH - len;
                count.textContent = left <= 200 ? left + ' characters left' : '';
                count.className = left <= 50 ? 'warn' : '';
            };

            if (state.draft) input.value = state.draft;

            input.addEventListener('input', sync);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    if (!sendBtn.disabled) document.getElementById('c-form').requestSubmit();
                }
            });

            document.getElementById('c-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const body = input.value.trim();
                if (!body || body.length > MAX_MESSAGE_LENGTH) return;
                const caseId = state.activeId;
                const errEl = document.getElementById('c-formerr');
                errEl.textContent = '';
                sendBtn.disabled = true;
                input.disabled = true;

                const { data, error } = await supabaseClient.rpc('portal_send_message', { p_case_id: caseId, p_body: body });

                input.disabled = false;

                if (error || !data) {
                    const raw = String((error && (error.message + ' ' + (error.code || ''))) || '');
                    if (/PGRST202|could not find the function/i.test(raw)) {
                        errEl.textContent = 'Messaging is not available yet. Please contact your lawyer directly.';
                    } else if (/too quickly/i.test(raw)) {
                        errEl.textContent = 'You are sending messages too quickly. Please wait a moment.';
                    } else if (/closed/i.test(raw)) {
                        errEl.textContent = 'This case is closed, so new messages are turned off.';
                    } else {
                        errEl.textContent = 'Your message was not sent. Please try again.';
                    }
                    sendBtn.disabled = false;
                    input.focus();
                    return;
                }

                if (String(caseId) === String(state.activeId)) {
                    state.items.push({ key: 'e' + data.id, side: 'client', ts: data.created_at, subject: '', body: data.body, doc: null });
                    state.signature = state.items.map(i => i.key).join('|');
                    renderThread(true);
                }
                input.value = '';
                state.draft = '';
                sync();
                input.focus();
            });

            sync();
        }

        const EVENT_ICONS = {
            case_opened: 'fa-folder-open',
            stage_changed: 'fa-flag',
            case_closed: 'fa-lock',
            case_reopened: 'fa-rotate-left',
            client_linked: 'fa-user-plus'
        };

        function fmtDate(value) {
            const d = new Date(value);
            if (isNaN(d)) return '';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function fmtDateTime(value) {
            const d = new Date(value);
            if (isNaN(d)) return '';
            return d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
        }

        function fmtReportDay(value) {
            const s = String(value || '').slice(0, 10);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
            return new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        async function loadUpdates() {
            const { data, error } = await supabaseClient.rpc('portal_my_updates');
            if (error) {
                console.warn('Could not load case updates:', error.message);
                const changed = !state.updatesFailed;
                state.updatesFailed = true;
                state.updates = [];
                state.updatesSig = '';
                return changed;
            }
            const next = data || [];
            const sig = JSON.stringify(next);
            const changed = state.updatesFailed || sig !== state.updatesSig;
            state.updatesFailed = false;
            state.updates = next;
            state.updatesSig = sig;
            return changed;
        }

        function updatesFor(caseId) {
            return state.updates.filter(u => String(u.case_id) === String(caseId));
        }

        function nextHearingOf(reports) {
            const now = Date.now();
            return reports
                .filter(r => r.next_hearing_date && new Date(r.next_hearing_date).getTime() > now)
                .sort((a, b) => new Date(a.next_hearing_date) - new Date(b.next_hearing_date))[0] || null;
        }

        function renderStats() {
            const el = document.getElementById('p-stats');
            if (!el) return;
            const active = state.cases.filter(c => c.status !== 'closed');
            const closedCount = state.cases.length - active.length;
            const activeIds = new Set(active.map(c => String(c.id)));
            const reports = state.updates.filter(u => u.source === 'report');
            const upcoming = nextHearingOf(reports.filter(r => activeIds.has(String(r.case_id))));
            const upCase = upcoming ? state.cases.find(c => String(c.id) === String(upcoming.case_id)) : null;
            const dash = state.updatesFailed;

            el.innerHTML = `
                <div class="p-stat">
                    <span class="p-stat-icon blue" aria-hidden="true"><i class="fa-solid fa-briefcase"></i></span>
                    <div class="p-stat-body"><div class="p-stat-num">${active.length}</div><div class="p-stat-label">Active cases</div></div>
                </div>
                <div class="p-stat">
                    <span class="p-stat-icon slate" aria-hidden="true"><i class="fa-solid fa-lock"></i></span>
                    <div class="p-stat-body"><div class="p-stat-num">${closedCount}</div><div class="p-stat-label">Closed cases</div></div>
                </div>
                <button type="button" class="p-stat" ${upCase ? `data-case-id="${escapeHtml(upCase.id)}"` : 'disabled'}>
                    <span class="p-stat-icon amber" aria-hidden="true"><i class="fa-solid fa-calendar-check"></i></span>
                    <div class="p-stat-body">
                        <div class="p-stat-num sm">${upcoming ? escapeHtml(fmtDateTime(upcoming.next_hearing_date)) : (dash ? '-' : 'None scheduled')}</div>
                        <div class="p-stat-label">Next hearing${upCase ? ' &bull; ' + escapeHtml(upCase.title) : ''}</div>
                    </div>
                </button>
                <div class="p-stat">
                    <span class="p-stat-icon green" aria-hidden="true"><i class="fa-solid fa-file-lines"></i></span>
                    <div class="p-stat-body"><div class="p-stat-num">${dash ? '-' : reports.length}</div><div class="p-stat-label">Reports shared with you</div></div>
                </div>`;
        }

        function renderOverview() {
            const pane = document.getElementById('c-pane');
            const c = activeCase();
            if (!pane || !c) return;

            const status = c.status === 'closed' ? 'closed' : 'active';
            const reports = updatesFor(c.id).filter(u => u.source === 'report')
                .sort((a, b) => String(b.event_at).localeCompare(String(a.event_at)));
            const latest = reports[0] || null;
            const next = status === 'closed' ? null : nextHearingOf(reports);

            const facts = [
                ['Status', `<span class="pill ${status}">${status}</span>`],
                ['Stage', c.case_stage ? escapeHtml(c.case_stage) : '-'],
                ['Case type', escapeHtml(c.case_type || 'General')],
                ['Lead lawyer', c.lead_lawyer ? 'Atty. ' + escapeHtml(c.lead_lawyer) : 'Not assigned yet'],
                c.case_number ? ['Case number', '#' + escapeHtml(c.case_number)] : null,
                c.court_branch ? ['Court', escapeHtml(c.court_branch)] : null,
                (c.date_filed || c.created_at) ? ['Date filed', escapeHtml(fmtDate(c.date_filed || c.created_at))] : null
            ].filter(Boolean).map(f => `<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('');

            let latestHtml;
            if (state.updatesFailed) {
                latestHtml = '<div class="o-sub">Case updates are not available right now. Please try again later.</div>';
            } else if (!latest) {
                latestHtml = '<div class="o-sub">No reports have been shared with you yet. When your lawyer shares a hearing report, it will appear here.</div>';
            } else {
                const text = String(latest.detail || '');
                const snippet = text.length > 280 ? text.slice(0, 280).trimEnd() + '\u2026' : text;
                latestHtml = `
                    <div class="o-update-title">${escapeHtml(latest.title)} <span class="pill-soft">${escapeHtml(latest.event_type || 'Report')}</span></div>
                    <div class="o-sub">${escapeHtml(fmtReportDay(latest.event_at))}${latest.outcome ? ' &bull; Outcome: ' + escapeHtml(latest.outcome) : ''}</div>
                    ${snippet ? `<div class="o-text">${escapeHtml(snippet)}</div>` : ''}
                    <button type="button" class="o-link-btn" data-goto="history">See full history</button>`;
            }

            pane.innerHTML = `
                <div class="c-scroll">
                    <div class="o-grid">
                        <section class="o-card">
                            <div class="o-label"><i class="fa-solid fa-calendar-check"></i> Next hearing</div>
                            ${next
                                ? `<div class="o-big">${escapeHtml(fmtDateTime(next.next_hearing_date))}</div><div class="o-sub">${escapeHtml(next.title)}</div>`
                                : `<div class="o-big muted">None scheduled</div><div class="o-sub">${status === 'closed' ? 'This case is closed.' : 'Your lawyer will share the next hearing date here once it is set.'}</div>`}
                        </section>
                        <section class="o-card">
                            <div class="o-label"><i class="fa-solid fa-circle-info"></i> Case details</div>
                            <dl class="o-facts">${facts}</dl>
                        </section>
                    </div>
                    <section class="o-card">
                        <div class="o-label"><i class="fa-solid fa-file-lines"></i> Latest update</div>
                        ${latestHtml}
                    </section>
                </div>`;
        }

        function renderHistory() {
            const pane = document.getElementById('c-pane');
            const c = activeCase();
            if (!pane || !c) return;

            if (state.updatesFailed) {
                pane.innerHTML = `<div class="c-scroll"><div class="c-state error"><i class="fa-solid fa-triangle-exclamation"></i><strong>We couldn't load your case history</strong><span>Please try again later.</span></div></div>`;
                return;
            }

            const items = updatesFor(c.id).slice().sort((a, b) => new Date(b.event_at) - new Date(a.event_at));
            const hasReports = items.some(i => i.source === 'report');

            if (items.length === 0) {
                pane.innerHTML = `<div class="c-scroll"><div class="c-empty"><i class="fa-regular fa-clock"></i><strong>No history yet</strong><span>Updates about your case will appear here.</span></div></div>`;
                return;
            }

            const html = items.map(i => {
                if (i.source === 'report') {
                    return `
                        <div class="h-item">
                            <span class="h-dot report" aria-hidden="true"><i class="fa-solid fa-file-lines"></i></span>
                            <div class="h-card">
                                <div class="h-card-top"><span class="h-title">${escapeHtml(i.title)}</span><span class="pill-soft">${escapeHtml(i.event_type || 'Report')}</span></div>
                                <div class="h-date">${escapeHtml(fmtReportDay(i.event_at))}</div>
                                ${i.outcome ? `<div class="h-meta"><strong>Outcome:</strong> ${escapeHtml(i.outcome)}</div>` : ''}
                                ${i.next_hearing_date ? `<div class="h-meta"><strong>Next hearing:</strong> ${escapeHtml(fmtDateTime(i.next_hearing_date))}</div>` : ''}
                                <details class="h-more">
                                    <summary>Read details</summary>
                                    <div class="h-label">What happened</div>
                                    <div class="h-pre">${escapeHtml(i.detail || '')}</div>
                                    ${i.next_steps ? `<div class="h-label">Next steps</div><div class="h-pre">${escapeHtml(i.next_steps)}</div>` : ''}
                                </details>
                            </div>
                        </div>`;
                }
                return `
                    <div class="h-item">
                        <span class="h-dot" aria-hidden="true"><i class="fa-solid ${EVENT_ICONS[i.event_type] || 'fa-circle'}"></i></span>
                        <div class="h-line"><span class="h-title">${escapeHtml(i.title)}</span><span class="h-date">${escapeHtml(fmtDateTime(i.event_at))}</span></div>
                    </div>`;
            }).join('');

            pane.innerHTML = `
                <div class="c-scroll">
                    ${hasReports ? '' : '<div class="h-note">Your lawyer hasn\'t shared any hearing reports yet. They will appear here when they do.</div>'}
                    <div class="h-timeline">${html}</div>
                </div>`;
        }

        function renderMessagesTab() {
            const pane = document.getElementById('c-pane');
            if (!pane) return;
            pane.innerHTML = `
                <div class="c-thread" id="c-thread" role="log" aria-live="polite" aria-label="Messages" tabindex="0">
                    <div class="c-skel"></div><div class="c-skel right"></div><div class="c-skel"></div>
                </div>
                <div id="c-footer"></div>`;
            loadThread(state.activeId, false);
        }

        function showTab(tab) {
            const pane = document.getElementById('c-pane');
            if (!pane) return;
            if (state.tab === 'messages' && tab !== 'messages') {
                const draftInput = document.getElementById('c-input');
                if (draftInput) state.draft = draftInput.value;
            }
            state.tab = tab;
            state.loadToken++;
            state.signature = '';
            document.querySelectorAll('.c-tab').forEach(t => {
                const on = t.dataset.tab === tab;
                t.classList.toggle('active', on);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            if (tab === 'overview') renderOverview();
            else if (tab === 'history') renderHistory();
            else renderMessagesTab();
        }

        document.getElementById('portal-logout-btn').addEventListener('click', async () => {
            clearInterval(state.pollTimer);
            try { localStorage.removeItem(IDLE_KEY); } catch (e) {}
            await supabaseClient.auth.signOut();
            window.location.href = 'client-login.html';
        });

        init();
    </script>
</body>
</html>
