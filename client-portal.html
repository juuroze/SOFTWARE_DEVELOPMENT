            if (error) {
                stillHere.innerHTML = `<div class="c-state error"><i class="fa-solid fa-triangle-exclamation"></i><strong>We couldn't load your documents</strong><span>Please try again later.</span></div>`;
                return;
            }
            if (!data || data.length === 0) {
                stillHere.innerHTML = `<div class="c-empty"><i class="fa-regular fa-folder-open"></i><strong>Nothing sent yet</strong><span>Documents you send will be listed here.</span></div>`;
                return;
            }
            stillHere.innerHTML = data.map(d => `
                <a href="#" class="d-item" data-doc-path="${escapeHtml(d.file_path || '')}" title="Open ${escapeHtml(d.title)}">
                    <span class="d-icon"><i class="fa-solid ${attachIcon(d.title)}"></i></span>
                    <span class="d-info">
                        <span class="d-name">${escapeHtml(d.title)}</span>
                        <span class="d-meta">${escapeHtml(d.size || '')}${d.size ? ' • ' : ''}Sent ${escapeHtml(fmtDateTime(d.created_at))}</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square d-open"></i>
                </a>`).join('');
        }

        async function uploadClientDocument(file) {
            const c = activeCase();
            if (!c || !file) return;
            const chooseBtn = document.getElementById('d-choose');
            if (UPLOAD_BLOCKED.test(file.name) || await hasBlockedSignature(file)) {
                setUploadStatus('Executable and compressed files (such as .exe or .zip) cannot be sent. Please send a PDF, Word, Excel, text or image file.', 'err');
                return;
            }
            if (!UPLOAD_ALLOWED.test(file.name)) {
                setUploadStatus('This file type is not allowed. Please send a PDF, Word, Excel, text or image file.', 'err');
                return;
            }
            if (file.size > UPLOAD_MAX_BYTES) {
                setUploadStatus('This file is larger than 10 MB. Please send a smaller file.', 'err');
                return;
            }
            if (file.size === 0) {
                setUploadStatus('This file is empty.', 'err');
                return;
            }
            if (chooseBtn) chooseBtn.disabled = true;
            setUploadStatus('Uploading ' + file.name + '...', 'busy');

            const safeName = file.name.replace(/[^A-Za-z0-9._-]+/g, '_');
            const path = `client-uploads/${c.id}/${Date.now()}-${safeName}`;
            try {
                const { error: upErr } = await supabaseClient.storage.from('documents').upload(path, file, { upsert: false, contentType: file.type || undefined });
                if (upErr) throw upErr;
                const sizeText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                const { error: regErr } = await supabaseClient.rpc('portal_register_upload', {
                    p_case_id: c.id,
                    p_title: file.name,
                    p_file_path: path,
                    p_size: sizeText
                });
                if (regErr) {
                    await supabaseClient.storage.from('documents').remove([path]);
                    throw regErr;
                }
                setUploadStatus('Sent. Your lawyer has been notified.', 'ok');
                loadMyUploads();
            } catch (err) {
                console.error('Upload failed:', err);
                const reason = err && err.message ? String(err.message) : '';
                setUploadStatus('We could not send this file. Please try again.' + (reason ? ' (' + reason + ')' : ''), 'err');
            } finally {
                if (chooseBtn) chooseBtn.disabled = false;
            }
        }

        const APPT_HOURS = [9, 10, 11, 12, 13, 14, 15, 16];
        const APPT_TZ_OFFSET = '+08:00';
        const APPT_MIN_LEAD_MS = 2 * 60 * 60 * 1000;
        const APPT_MAX_DAYS = 60;
        const APPT_ERRORS = {
            slot_taken: 'That time was just taken. Please pick another time.',
            invalid_slot: 'Please pick a time from Monday to Friday, 9:00 AM to 4:00 PM.',
            too_soon: 'Please choose a time at least 2 hours from now.',
            too_far: 'Please choose a date within the next 60 days.',
            too_many_pending: 'You already have 3 pending requests. Please wait for your lawyer to respond or cancel one.',
            duplicate_request: 'You already have a pending request for this time.',
            case_closed: 'This case is closed, so new appointments cannot be requested.',
            no_lawyer: 'No lawyer is assigned to this case yet.',
            invalid_topic: 'Please tell us briefly what the appointment is about.',
            invalid_notes: 'Your notes are too long.',
            case_not_found: 'We could not find this case.',
            not_pending: 'This request was already answered, so it cannot be cancelled.',
            request_not_found: 'We could not find this request.'
        };
        const apptState = { date: '', time: null, taken: [], loadingSlots: false, slotToken: 0, listSig: '', submitting: false };

        function apptMessage(err) {
            const key = err && err.message ? String(err.message).trim() : '';
            return APPT_ERRORS[key] || 'Something went wrong. Please try again.';
        }

        function manilaToday() {
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }

        function addDaysToDateStr(dateStr, n) {
            const d = new Date(dateStr + 'T12:00:00Z');
            d.setUTCDate(d.getUTCDate() + n);
            return d.toISOString().slice(0, 10);
        }

        function isWeekendDateStr(dateStr) {
            const day = new Date(dateStr + 'T12:00:00Z').getUTCDay();
            return day === 0 || day === 6;
        }

        function apptSlotIso(dateStr, hour) {
            return dateStr + 'T' + String(hour).padStart(2, '0') + ':00:00' + APPT_TZ_OFFSET;
        }

        function apptHourLabel(hour) {
            const h12 = hour % 12 === 0 ? 12 : hour % 12;
            return h12 + ':00 ' + (hour < 12 ? 'AM' : 'PM');
        }

        function fmtApptWhen(startIso) {
            const s = new Date(startIso);
            if (isNaN(s)) return '';
            const day = s.toLocaleDateString('en-US', { timeZone: 'Asia/Manila', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            const time = s.toLocaleTimeString('en-US', { timeZone: 'Asia/Manila', hour: 'numeric', minute: '2-digit' });
            return day + ' at ' + time + ' (PHT)';
        }

        function setApptStatus(text, kind) {
            const el = document.getElementById('a-status');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'd-status' + (kind ? ' ' + kind : '');
        }

        function updateApptSubmitState() {
            const btn = document.getElementById('a-submit');
            const topic = document.getElementById('a-topic');
            if (!btn) return;
            btn.disabled = apptState.submitting || !apptState.date || apptState.time === null || !topic || !topic.value.trim();
            const summary = document.getElementById('a-summary');
            if (summary) {
                if (apptState.date && apptState.time !== null) {
                    summary.className = 'a-summary ready';
                    summary.innerHTML = '<b>Requested schedule</b>' + escapeHtml(fmtApptWhen(apptSlotIso(apptState.date, apptState.time)));
                } else {
                    summary.className = 'a-summary';
                    summary.innerHTML = '<b>Requested schedule</b>No date and time selected yet.';
                }
            }
        }

        function setApptAvailability(text) {
            const el = document.getElementById('a-avail');
            if (el) el.textContent = text || '';
        }

        function renderApptSlots() {
            const wrap = document.getElementById('a-slots');
            if (!wrap) return;
            setApptAvailability('');
            const date = apptState.date;
            if (!date) {
                wrap.innerHTML = '<div class="a-hint">Please select a date to view the available times.</div>';
                return;
            }
            const today = manilaToday();
            if (date < today || date > addDaysToDateStr(today, APPT_MAX_DAYS)) {
                wrap.innerHTML = '<div class="a-hint">Please select a date within the next 60 days.</div>';
                return;
            }
            if (isWeekendDateStr(date)) {
                wrap.innerHTML = '<div class="a-hint">Appointments are available from Monday to Friday only. Please select a weekday.</div>';
                return;
            }
            if (apptState.loadingSlots) {
                wrap.innerHTML = '<div class="a-hint">Checking availability...</div>';
                return;
            }
            const earliest = Date.now() + APPT_MIN_LEAD_MS;
            let openCount = 0;
            const html = APPT_HOURS.map(hour => {
                const startMs = Date.parse(apptSlotIso(date, hour));
                const endMs = startMs + 60 * 60 * 1000;
                const busy = apptState.taken.some(t => t.start < endMs && t.end > startMs);
                const past = startMs < earliest;
                const off = past || busy;
                if (!off) openCount++;
                const sel = apptState.time === hour;
                const title = busy ? 'Unavailable: your attorney has another appointment or hearing at this time.' : (past ? 'This time can no longer be requested.' : 'Available');
                return `<button type="button" class="a-slot ${sel ? 'sel' : ''} ${off ? 'off' : ''}" data-hour="${hour}" aria-pressed="${sel}" title="${title}" ${off ? 'disabled aria-disabled="true"' : ''}>${apptHourLabel(hour)}${busy ? '<small>Unavailable</small>' : ''}</button>`;
            }).join('');
            wrap.innerHTML = html;
            setApptAvailability(openCount + ' of ' + APPT_HOURS.length + ' times available');
            if (openCount === 0) {
                wrap.insertAdjacentHTML('beforeend', '<div class="a-hint">Your attorney has no open times on this date. Please select another date.</div>');
            }
        }

        async function loadApptSlots(silent) {
            const c = activeCase();
            const date = apptState.date;
            if (!c || !date) return;
            const today = manilaToday();
            if (date < today || date > addDaysToDateStr(today, APPT_MAX_DAYS) || isWeekendDateStr(date)) {
                apptState.taken = [];
                apptState.loadingSlots = false;
                renderApptSlots();
                return;
            }
            const token = ++apptState.slotToken;
            const hadTime = apptState.time !== null;
            if (!silent) {
                apptState.loadingSlots = true;
                renderApptSlots();
            }
            const { data, error } = await supabaseClient.rpc('portal_taken_slots', {
                p_case_id: c.id,
                p_from: apptSlotIso(date, 0),
                p_to: apptSlotIso(addDaysToDateStr(date, 1), 0)
            });
            if (token !== apptState.slotToken) return;
            apptState.loadingSlots = false;
            if (error) {
                console.error('Slot lookup failed:', error);
                if (silent) return;
                apptState.taken = [];
                setApptStatus('We could not check the available times. Please try again.', 'err');
            } else {
                apptState.taken = (data || []).map(r => ({ start: Date.parse(r.slot_start), end: Date.parse(r.slot_end) }));
            }
            if (apptState.time !== null) {
                const startMs = Date.parse(apptSlotIso(date, apptState.time));
                const stillFree = startMs >= Date.now() + APPT_MIN_LEAD_MS && !apptState.taken.some(t => t.start < startMs + 3600000 && t.end > startMs);
                if (!stillFree) {
                    apptState.time = null;
                    if (hadTime) setApptStatus('The time you selected is no longer available. Please choose another time.', 'err');
                }
            }
            renderApptSlots();
            updateApptSubmitState();
        }

        function renderAppointmentsTab() {
            const pane = document.getElementById('c-pane');
            const c = activeCase();
            if (!pane || !c) return;
            apptState.date = '';
            apptState.time = null;
            apptState.taken = [];
            apptState.loadingSlots = false;
            apptState.slotToken++;
            apptState.listSig = '';
            apptState.submitting = false;

            const closed = c.status === 'closed';
            const noLawyer = !c.lead_lawyer;
            const today = manilaToday();

            let formHtml;
            if (closed) {
                formHtml = '<div class="a-closed">This case is closed. New appointments can no longer be requested. Your previous requests are listed below.</div>';
            } else if (noLawyer) {
                formHtml = '<div class="a-closed">An attorney has not yet been assigned to this case. You may submit an appointment request once an attorney has been assigned.</div>';
            } else {
                formHtml = `
                    <div class="a-intro">
                        <div class="a-intro-item"><i class="fa-solid fa-user-tie"></i><div><span>Attorney</span><strong>Atty. ${escapeHtml(c.lead_lawyer)}</strong></div></div>
                        <div class="a-intro-item"><i class="fa-regular fa-calendar-check"></i><div><span>Office hours</span><strong>Mon to Fri, 9:00 AM to 5:00 PM (PHT)</strong></div></div>
                    </div>
                    <div class="a-grid">
                        <div class="a-col">
                            <div class="a-step"><span class="a-step-num">1</span> Select a preferred date</div>
                            <input type="date" id="a-date" class="a-input" min="${today}" max="${addDaysToDateStr(today, APPT_MAX_DAYS)}" aria-label="Preferred date">
                            <div class="a-step" id="a-time-label"><span class="a-step-num">2</span> Select an available time</div>
                            <div class="a-avail" id="a-avail" aria-live="polite"></div>
                            <div class="a-slots" id="a-slots" role="group" aria-labelledby="a-time-label"></div>
                            <div class="a-legend" aria-hidden="true">
                                <span><i class="a-key open"></i> Available</span>
                                <span><i class="a-key sel"></i> Selected</span>
                                <span><i class="a-key off"></i> Unavailable</span>
                            </div>
                        </div>
                        <div class="a-col">
                            <div class="a-step"><span class="a-step-num">3</span> Appointment details</div>
                            <label class="a-label" for="a-topic">Subject of the appointment</label>
                            <input type="text" id="a-topic" class="a-input" maxlength="120" placeholder="e.g. Review of the settlement offer" autocomplete="off">
                            <label class="a-label" for="a-notes">Additional information <small>(optional)</small></label>
                            <textarea id="a-notes" class="a-input" maxlength="1000" placeholder="Provide any details your attorney should know in advance."></textarea>
                            <div class="a-summary" id="a-summary" aria-live="polite"></div>
                            <div class="a-actions">
                                <button type="button" class="d-btn" id="a-submit" disabled><i class="fa-solid fa-paper-plane"></i> Submit request</button>
                                <span class="d-status" id="a-status" role="status" aria-live="polite"></span>
                            </div>
                        </div>
                    </div>`;
            }

            pane.innerHTML = `
                <div class="c-scroll">
                    <section class="a-card">
                        <div class="a-card-head">
                            <h3>Request an Appointment</h3>
                            <p>Submit your preferred schedule for review. Your attorney will confirm or propose a different time, and the outcome will appear under your requests below.</p>
                        </div>
                        <div class="a-card-body">${formHtml}</div>
                    </section>
                    <div class="d-heading">Your appointment requests</div>
                    <div id="a-list"><div class="c-skel"></div></div>
                </div>`;

            if (!closed && !noLawyer) {
                renderApptSlots();
                updateApptSubmitState();
                const dateInput = document.getElementById('a-date');
                dateInput.addEventListener('change', () => {
                    apptState.date = dateInput.value;
                    apptState.time = null;
                    apptState.taken = [];
                    setApptStatus('');
                    if (!apptState.date) {
                        renderApptSlots();
                        updateApptSubmitState();
                        return;
                    }
                    loadApptSlots();
                    updateApptSubmitState();
                });
                document.getElementById('a-slots').addEventListener('click', (e) => {
                    const btn = e.target.closest('.a-slot');
                    if (!btn || btn.disabled) return;
                    apptState.time = Number(btn.dataset.hour);
                    setApptStatus('');
                    renderApptSlots();
                    updateApptSubmitState();
                });
                document.getElementById('a-topic').addEventListener('input', updateApptSubmitState);
                document.getElementById('a-submit').addEventListener('click', submitAppointmentRequest);
            }

            document.getElementById('a-list').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-appt-cancel]');
                if (btn) cancelAppointmentRequest(btn.getAttribute('data-appt-cancel'), btn);
            });

            loadMyAppointments(false);
        }

        async function loadMyAppointments(silent) {
            const c = activeCase();
            if (!c) return;
            const caseId = c.id;
            const { data, error } = await supabaseClient.rpc('portal_my_appointments', { p_case_id: caseId });
            const listEl = document.getElementById('a-list');
            if (!listEl || String(state.activeId) !== String(caseId) || state.tab !== 'appointments') return;
            if (error) {
                if (silent) return;
                listEl.innerHTML = `<div class="c-state error"><i class="fa-solid fa-triangle-exclamation"></i><strong>We couldn't load your requests</strong><span>Please try again later.</span></div>`;
                return;
            }
            const rows = data || [];
            const sig = rows.map(r => [r.id, r.status, r.decided_at, r.decision_note].join('|')).join(';');
            if (silent && sig === apptState.listSig) return;
            apptState.listSig = sig;

            if (rows.length === 0) {
                listEl.innerHTML = `<div class="c-empty"><i class="fa-regular fa-calendar"></i><strong>No appointment requests</strong><span>Requests you submit will be listed here with their status.</span></div>`;
                return;
            }
            listEl.innerHTML = rows.map(r => {
                const status = ['pending', 'approved', 'declined', 'cancelled'].includes(r.status) ? r.status : 'pending';
                const label = status === 'pending' ? 'Awaiting confirmation' : status;
                const lawyer = r.lawyer_name ? 'Atty. ' + escapeHtml(r.lawyer_name) : 'Your lawyer';
                return `
                    <div class="a-item">
                        <div class="a-item-top">
                            <div>
                                <div class="a-item-title">${escapeHtml(r.topic)}</div>
                                <div class="a-item-when">${escapeHtml(fmtApptWhen(r.requested_start))} &bull; ${lawyer}</div>
                            </div>
                            <span class="a-pill ${status}">${escapeHtml(label)}</span>
                        </div>
                        ${r.notes ? `<div class="a-item-note"><b>Your notes:</b> ${escapeHtml(r.notes)}</div>` : ''}
                        ${r.decision_note ? `<div class="a-item-note"><b>Message from your attorney:</b> ${escapeHtml(r.decision_note)}</div>` : ''}
                        ${status === 'approved' ? '<div class="a-item-note">This appointment is confirmed. To change the schedule, please contact your attorney through Messages.</div>' : ''}
                        ${status === 'pending' ? `<button type="button" class="a-cancel" data-appt-cancel="${escapeHtml(r.id)}">Withdraw request</button>` : ''}
                    </div>`;
            }).join('');
        }

        async function submitAppointmentRequest() {
            const c = activeCase();
            const topicEl = document.getElementById('a-topic');
            const notesEl = document.getElementById('a-notes');
            if (!c || !topicEl || apptState.submitting) return;
            const topic = topicEl.value.trim();
            if (!apptState.date || apptState.time === null) {
                setApptStatus('Please select a date and time.', 'err');
                return;
            }
            if (!topic) {
                setApptStatus('Please enter the subject of the appointment.', 'err');
                return;
            }
            apptState.submitting = true;
            updateApptSubmitState();
            setApptStatus('Submitting your request...', 'busy');
            const { error } = await supabaseClient.rpc('portal_request_appointment', {
                p_case_id: c.id,
                p_start: apptSlotIso(apptState.date, apptState.time),
                p_topic: topic,
                p_notes: notesEl ? notesEl.value.trim() : ''
            });
            apptState.submitting = false;
            if (!document.getElementById('a-submit')) return;
            if (error) {
                console.error('Appointment request failed:', error);
                setApptStatus(apptMessage(error), 'err');
                if (error.message === 'slot_taken' || error.message === 'too_soon') loadApptSlots();
                updateApptSubmitState();
                return;
            }
            topicEl.value = '';
            if (notesEl) notesEl.value = '';
            apptState.time = null;
            setApptStatus('Your request has been submitted. Your attorney has been notified and will confirm the schedule.', 'ok');
            renderApptSlots();
            updateApptSubmitState();
            apptState.listSig = '';
            loadMyAppointments(false);
        }

        async function cancelAppointmentRequest(id, btn) {
            if (!id || !confirm('Withdraw this appointment request?')) return;
            if (btn) btn.disabled = true;
            const { error } = await supabaseClient.rpc('portal_cancel_appointment', { p_id: id });
            if (error) {
                console.error('Cancel failed:', error);
                alert(apptMessage(error));
            }
            apptState.listSig = '';
            loadMyAppointments(false);
            if (apptState.date) loadApptSlots();
        }


        function showTab(tab) {
            const pane = document.getElementById('c-pane');
            if (!pane) return;
            if (state.tab === 'messages' && tab !== 'messages') {
                const draftInput = document.getElementById('c-input');
                if (draftInput) state.draft = draftInput.value;
            }
            state.tab = tab;
            state.loadToken++;
            state.signature = '';
            document.querySelectorAll('.c-tab').forEach(t => {
                const on = t.dataset.tab === tab;
                t.classList.toggle('active', on);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            if (tab === 'overview') renderOverview();
            else if (tab === 'history') renderHistory();
            else if (tab === 'documents') renderDocumentsTab();
            else if (tab === 'appointments') renderAppointmentsTab();
            else renderMessagesTab();
            paintUnread();
        }

        if (window.JuriSyncSound) {
            window.JuriSyncSound.bindToggle(document.getElementById('portal-sound-toggle'));
            document.getElementById('portal-sound-test').addEventListener('click', () => window.JuriSyncSound.play(true));
        }

        document.getElementById('portal-logout-btn').addEventListener('click', async () => {
            clearInterval(state.pollTimer);
            try { localStorage.removeItem(IDLE_KEY); } catch (e) {}
            await supabaseClient.auth.signOut();
            window.location.href = 'client-login.html';
        });

        init();
    </script>
    <script src="a11y.js?v=1" defer></script>
</body>
</html>
