<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuriSync - Your Case</title>
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p-navy: #0f172a;
            --p-navy-2: #1e293b;
            --p-blue: #3b82f6;
            --p-blue-dark: #2563eb;
            --p-text: #0f172a;
            --p-muted: #64748b;
            --p-line: #e2e8f0;
            --p-bg: #f1f5f9;
            --p-card: #ffffff;
        }
        body.portal-body {
            background: var(--p-bg);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            color: var(--p-text);
        }
        .p-header {
            background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
            color: #fff;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .p-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .p-logo { width: 38px; height: auto; flex: 0 0 auto; }
        .p-brand strong { display: block; font-size: 17px; line-height: 1.2; letter-spacing: -0.2px; }
        .p-brand span { display: block; font-size: 12px; color: #94a3b8; }
        .p-user { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .p-user-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .p-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--p-blue); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; flex: 0 0 auto;
        }
        .p-avatar.sm { width: 32px; height: 32px; font-size: 12px; }
        .p-avatar.soft { background: #dbeafe; color: var(--p-blue-dark); }
        .p-logout {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(148,163,184,0.25);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px;
            transition: background-color 0.2s ease;
        }
        .p-logout:hover { background: rgba(248,113,113,0.16); color: #fecaca; }
        .p-logout:focus-visible, .p-case:focus-visible, .c-send:focus-visible, .p-retry:focus-visible {
            outline: 2px solid #60a5fa; outline-offset: 2px;
        }
        .p-main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 40px; }
        .p-greet h1 { font-size: 26px; margin: 0; letter-spacing: -0.4px; }
        .p-greet p { margin: 4px 0 22px; color: var(--p-muted); font-size: 14px; }
        .p-shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
        .p-cases { display: flex; flex-direction: column; gap: 10px; }
        .p-section-title { font-size: 14px; font-weight: 700; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; color: var(--p-navy-2); }
        .p-count { background: #e2e8f0; color: #475569; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
        .p-case-list { display: flex; flex-direction: column; gap: 10px; }
        .p-case {
            text-align: left; width: 100%;
            background: var(--p-card); border: 1px solid var(--p-line); border-radius: 14px;
            padding: 14px 16px; cursor: pointer; font: inherit; color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .p-case:hover { border-color: #bfdbfe; }
        .p-case.active { border-color: var(--p-blue); box-shadow: 0 6px 18px -8px rgba(59,130,246,0.45); }
        .p-case.active::before {
            content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px;
            border-radius: 0 4px 4px 0; background: var(--p-blue);
        }
        .p-case-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .p-case h3 { margin: 0; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
        .p-case-sub { margin: 6px 0 0; font-size: 12px; color: var(--p-muted); line-height: 1.5; }
        .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; text-transform: capitalize; white-space: nowrap; }
        .pill.active { background: #dcfce7; color: #16a34a; }
        .pill.closed { background: #f1f5f9; color: #64748b; }
        .p-convo {
            background: var(--p-card); border: 1px solid var(--p-line); border-radius: 18px;
            display: flex; flex-direction: column; overflow: hidden;
            height: calc(100vh - 190px); min-height: 520px;
        }
        .c-head {
            padding: 16px 22px; border-bottom: 1px solid var(--p-line);
            display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .c-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.2px; overflow-wrap: anywhere; }
        .c-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--p-muted); }
        .c-meta .chip { background: #f1f5f9; border-radius: 99px; padding: 3px 10px; font-weight: 600; color: #475569; }
        .c-lawyer { display: flex; align-items: center; gap: 10px; }
        .c-lawyer strong { display: block; font-size: 13px; }
        .c-lawyer span { display: block; font-size: 12px; color: var(--p-muted); }
        .c-thread {
            flex: 1; overflow-y: auto; padding: 20px 22px;
            background: #f8fafc; display: flex; flex-direction: column; gap: 6px;
            scroll-behavior: smooth;
        }
        .c-thread:focus-visible { outline: 2px solid #93c5fd; outline-offset: -2px; }
        .c-day { align-self: center; font-size: 12px; font-weight: 600; color: #64748b; background: #e2e8f0; padding: 3px 12px; border-radius: 99px; margin: 12px 0 8px; }
        .c-row { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
        .c-row.mine { flex-direction: row-reverse; }
        .c-bubble-wrap { max-width: min(78%, 560px); display: flex; flex-direction: column; gap: 4px; }
        .c-row.mine .c-bubble-wrap { align-items: flex-end; }
        .c-who { font-size: 12px; font-weight: 600; color: #475569; padding: 0 4px; }
        .c-bubble {
            padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.55;
            overflow-wrap: anywhere; white-space: pre-wrap;
        }
        .c-row.theirs .c-bubble { background: #fff; border: 1px solid var(--p-line); border-bottom-left-radius: 5px; }
        .c-row.mine .c-bubble { background: var(--p-blue-dark); color: #fff; border-bottom-right-radius: 5px; }
        .c-subject { display: block; font-weight: 700; margin-bottom: 4px; }
        .c-attach {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 8px;
            padding: 7px 12px; border-radius: 10px; background: #eff6ff; border: 1px solid #bfdbfe;
            color: var(--p-blue-dark); font-size: 12px; font-weight: 600; text-decoration: none;
            max-width: 100%; white-space: normal; overflow-wrap: anywhere;
        }
        .c-attach:hover { background: #dbeafe; }
        .c-time { font-size: 11px; color: #94a3b8; padding: 0 4px; }
        .c-empty, .c-state { margin: auto; text-align: center; color: var(--p-muted); max-width: 320px; padding: 20px; }
        .c-empty i, .c-state i { font-size: 30px; color: #93c5fd; margin-bottom: 12px; }
        .c-empty strong, .c-state strong { display: block; color: var(--p-text); margin-bottom: 4px; font-size: 15px; }
        .c-state.error i { color: #f87171; }
        .p-retry {
            margin-top: 12px; background: var(--p-navy); color: #fff; border: none;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
        }
        .c-skel { height: 54px; border-radius: 16px; background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: cshimmer 1.3s infinite; width: 60%; }
        .c-skel.right { align-self: flex-end; width: 45%; }
        @keyframes cshimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .c-composer { border-top: 1px solid var(--p-line); padding: 12px 16px 10px; background: #fff; }
        .c-form { display: flex; gap: 10px; align-items: flex-end; }
        .c-input {
            flex: 1; resize: none; border: 1px solid #cbd5e1; border-radius: 14px;
            padding: 11px 14px; font: inherit; font-size: 14px; line-height: 1.5;
            max-height: 140px; min-height: 44px; box-sizing: border-box;
        }
        .c-input:focus { outline: none; border-color: var(--p-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .c-send {
            width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer;
            background: var(--p-blue-dark); color: #fff; font-size: 15px; flex: 0 0 auto;
            transition: background-color 0.2s ease;
        }
        .c-send:hover:not(:disabled) { background: #1d4ed8; }
        .c-send:disabled { background: #cbd5e1; cursor: not-allowed; }
        .c-hint { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-top: 6px; padding: 0 4px; }
        .c-hint .warn { color: #dc2626; font-weight: 600; }
        .c-note { padding: 14px 20px; border-top: 1px solid var(--p-line); font-size: 13px; color: var(--p-muted); display: flex; align-items: center; gap: 10px; background: #fff; }
        .c-formerr { color: #dc2626; font-size: 12px; margin: 6px 4px 0; min-height: 0; }
        .p-empty-all { background: #fff; border: 1px solid var(--p-line); border-radius: 18px; padding: 48px 24px; text-align: center; color: var(--p-muted); }
        .p-empty-all i { font-size: 34px; color: #93c5fd; margin-bottom: 14px; }
        .p-boot { text-align: center; color: var(--p-muted); margin-top: 80px; }
        @media (max-width: 900px) {
            .p-header { padding: 10px 16px; }
            .p-user-name { display: none; }
            .p-main { padding: 20px 14px 28px; }
            .p-shell { grid-template-columns: 1fr; }
            .p-case-list { flex-direction: row; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
            .p-case { min-width: 250px; width: 250px; scroll-snap-align: start; }
            .p-convo { height: auto; min-height: 0; max-height: none; }
            .c-thread { min-height: 320px; max-height: 60vh; }
            .c-bubble-wrap { max-width: 86%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .c-thread { scroll-behavior: auto; }
            .c-skel { animation: none; }
            .p-case, .c-send, .p-logout { transition: none; }
        }
    </style>
</head>
<body class="portal-body">
    <header class="p-header">
        <div class="p-brand">
            <img src="logo11.png" alt="" class="p-logo">
            <div>
                <strong>JuriSync</strong>
                <span>Client Portal</span>
            </div>
        </div>
        <div class="p-user">
            <span class="p-avatar" id="p-avatar" aria-hidden="true"></span>
            <span class="p-user-name" id="p-username"></span>
            <button class="p-logout" id="portal-logout-btn" type="button"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <main class="p-main" id="portal-container">
        <p class="p-boot">Loading your account...</p>
    </main>

    <script>
        const SUPABASE_URL = 'https://qksgqkmctjzmzhzmrbhj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Hx1bN74JlwOKBW6wv0wRgQ_fkP9N-b5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const MAX_MESSAGE_LENGTH = 2000;
        const POLL_MS = 30000;

        const container = document.getElementById('portal-container');
        const state = {
            client: null,
            userId: null,
            cases: [],
            activeId: null,
            items: [],
            signature: '',
            pollTimer: null,
            loadToken: 0
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function initials(name) {
            const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (parts.length === 0) return '?';
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function formatTime(iso) {
            return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function dayKey(iso) {
            const d = new Date(iso);
            return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        }

        function dayLabel(iso) {
            const d = new Date(iso);
            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            if (dayKey(iso) === dayKey(today.toISOString())) return 'Today';
            if (dayKey(iso) === dayKey(yesterday.toISOString())) return 'Yesterday';
            return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
        }

        document.addEventListener('click', async (e) => {
            const el = e.target.closest('[data-doc-path]');
            if (!el) return;
            e.preventDefault();
            const popup = window.open('about:blank', '_blank');
            const { data, error } = await supabaseClient.storage.from('documents').createSignedUrl(el.dataset.docPath, 300);
            if (error || !data) {
                if (popup) popup.close();
                alert('Could not open this file.');
                return;
            }
            if (popup) {
                popup.opener = null;
                popup.location.href = data.signedUrl;
            }
        });

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = 'client-login.html';
                return;
            }

            const { data: aal } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
            if (!aal || aal.currentLevel !== 'aal2') {
                window.location.href = 'client-login.html';
                return;
            }

            state.userId = session.user.id;

            await supabaseClient.rpc('link_my_client_account');

            const { data: client } = await supabaseClient
                .from('clients')
                .select('*')
                .eq('auth_user_id', session.user.id)
                .maybeSingle();

            if (!client) {
                container.innerHTML = `
                    <div class="p-empty-all">
                        <i class="fa-solid fa-circle-exclamation" style="color:#f59e0b;"></i>
                        <p>We couldn't find an approved client record linked to <strong>${escapeHtml(session.user.email)}</strong>.</p>
                        <p style="font-size:13px;">Please contact your lawyer to confirm you've been added as a client.</p>
                    </div>`;
                return;
            }

            state.client = client;
            document.getElementById('p-avatar').textContent = initials(client.client_name);
            document.getElementById('p-username').textContent = client.client_name || '';
            await loadCases();
        }

        async function loadCases() {
            const { data: cases, error } = await supabaseClient.rpc('portal_my_cases');

            if (error) {
                container.innerHTML = `
                    <div class="p-empty-all">
                        <i class="fa-solid fa-triangle-exclamation" style="color:#f87171;"></i>
                        <p>We couldn't load your cases: ${escapeHtml(error.message)}</p>
                        <button class="p-retry" type="button" id="retry-cases">Try again</button>
                    </div>`;
                document.getElementById('retry-cases').addEventListener('click', loadCases);
                return;
            }

            state.cases = cases || [];
            const firstName = String(state.client.client_name || '').trim().split(/\s+/)[0] || 'there';

            if (state.cases.length === 0) {
                container.innerHTML = `
                    <div class="p-greet"><h1>Welcome, ${escapeHtml(firstName)}</h1></div>
                    <div class="p-empty-all">
                        <i class="fa-regular fa-folder-open"></i>
                        <p><strong style="color:#0f172a;">No cases on file yet</strong></p>
                        <p style="font-size:13px;">When your lawyer opens a case for you, it will show up here.</p>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="p-greet">
                    <h1>Welcome back, ${escapeHtml(firstName)}</h1>
                    <p>Follow your case and message your lawyer in one place.</p>
                </div>
                <div class="p-shell">
                    <aside class="p-cases" aria-label="Your cases">
                        <h2 class="p-section-title">Your cases <span class="p-count">${state.cases.length}</span></h2>
                        <div class="p-case-list" id="case-list"></div>
                    </aside>
                    <section class="p-convo" id="convo" aria-label="Conversation"></section>
                </div>`;

            document.getElementById('case-list').addEventListener('click', (e) => {
                const card = e.target.closest('[data-case-id]');
                if (card) openCase(card.getAttribute('data-case-id'));
            });

            const keep = state.cases.find(c => String(c.id) === String(state.activeId));
            openCase(keep ? keep.id : state.cases[0].id);
        }

        function renderCaseList() {
            const listEl = document.getElementById('case-list');
            if (!listEl) return;
            listEl.innerHTML = state.cases.map(c => {
                const lawyerName = c.lead_lawyer ? `Atty. ${escapeHtml(c.lead_lawyer)}` : 'Lawyer not assigned yet';
                const status = c.status === 'closed' ? 'closed' : 'active';
                const active = String(c.id) === String(state.activeId);
                return `
                    <button type="button" class="p-case ${active ? 'active' : ''}" data-case-id="${escapeHtml(c.id)}" aria-pressed="${active}">
                        <div class="p-case-top">
                            <h3>${escapeHtml(c.title)}</h3>
                            <span class="pill ${status}">${escapeHtml(status)}</span>
                        </div>
                        <p class="p-case-sub">${c.case_number ? '#' + escapeHtml(c.case_number) + ' • ' : ''}${escapeHtml(c.case_type || 'General')}<br>${lawyerName}</p>
                    </button>`;
            }).join('');
        }

        function activeCase() {
            return state.cases.find(c => String(c.id) === String(state.activeId)) || null;
        }

        function openCase(caseId) {
            state.activeId = caseId;
            state.items = [];
            state.signature = '';
            renderCaseList();

            const c = activeCase();
            const convo = document.getElementById('convo');
            if (!c || !convo) return;

            const lawyer = c.lead_lawyer ? `Atty. ${escapeHtml(c.lead_lawyer)}` : 'Your legal team';
            const status = c.status === 'closed' ? 'closed' : 'active';

            convo.innerHTML = `
                <div class="c-head">
                    <div>
                        <h2>${escapeHtml(c.title)}</h2>
                        <div class="c-meta">
                            <span class="pill ${status}">${escapeHtml(status)}</span>
                            ${c.case_number ? `<span class="chip">#${escapeHtml(c.case_number)}</span>` : ''}
                            <span class="chip">${escapeHtml(c.case_type || 'General')}</span>
                            ${c.case_stage ? `<span class="chip">${escapeHtml(c.case_stage)}</span>` : ''}
                        </div>
                    </div>
                    <div class="c-lawyer">
                        <span class="p-avatar sm soft" aria-hidden="true">${escapeHtml(initials(c.lead_lawyer || 'JS'))}</span>
                        <div><strong>${lawyer}</strong><span>${c.lead_lawyer ? 'Your lead lawyer' : 'Assignment pending'}</span></div>
                    </div>
                </div>
                <div class="c-thread" id="c-thread" role="log" aria-live="polite" aria-label="Messages" tabindex="0">
                    <div class="c-skel"></div><div class="c-skel right"></div><div class="c-skel"></div>
                </div>
                <div id="c-footer"></div>`;

            loadThread(caseId, false);
            startPolling();
        }

        function startPolling() {
            clearInterval(state.pollTimer);
            state.pollTimer = setInterval(() => {
                if (document.hidden || !state.activeId) return;
                loadThread(state.activeId, true);
            }, POLL_MS);
        }

        async function loadThread(caseId, silent) {
            const token = ++state.loadToken;

            const { data: rows, error } = await supabaseClient
                .from('email_queue')
                .select('*, documents(title, file_path)')
                .eq('case_id', caseId)
                .eq('is_sent', true)
                .order('sent_at', { ascending: true });

            if (token !== state.loadToken || String(caseId) !== String(state.activeId)) return;

            if (error) {
                if (!silent) renderThreadError(caseId);
                return;
            }

            const items = (rows || []).map(m => ({
                key: 'e' + m.id,
                side: m.kind === 'client_message' ? 'client' : 'lawyer',
                ts: m.sent_at || m.created_at,
                subject: m.kind === 'client_message' ? '' : (m.subject || ''),
                body: m.body || '',
                doc: m.documents || null
            }));
            items.sort((a, b) => new Date(a.ts) - new Date(b.ts));

            const signature = items.map(i => i.key).join('|');
            const firstPaint = !document.getElementById('c-form') && !document.getElementById('c-footer').children.length;

            if (signature !== state.signature || firstPaint) {
                const threadEl = document.getElementById('c-thread');
                const nearBottom = threadEl ? (threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 80) : true;
                state.items = items;
                state.signature = signature;
                renderThread(nearBottom || firstPaint);
            }

            if (firstPaint) renderFooter();
        }

        function renderThreadError(caseId) {
            const threadEl = document.getElementById('c-thread');
            if (!threadEl) return;
            threadEl.innerHTML = `
                <div class="c-state error">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <strong>We couldn't load your messages</strong>
                    <span>Check your connection and try again.</span><br>
                    <button type="button" class="p-retry" id="retry-thread">Try again</button>
                </div>`;
            document.getElementById('retry-thread').addEventListener('click', () => {
                threadEl.innerHTML = '<div class="c-skel"></div><div class="c-skel right"></div>';
                loadThread(caseId, false);
            });
        }

        function renderThread(scrollToEnd) {
            const threadEl = document.getElementById('c-thread');
            if (!threadEl) return;
            const c = activeCase();
            const lawyerLabel = c && c.lead_lawyer ? `Atty. ${c.lead_lawyer}` : 'Your legal team';

            if (state.items.length === 0) {
                threadEl.innerHTML = `
                    <div class="c-empty">
                        <i class="fa-regular fa-comments"></i>
                        <strong>No messages yet</strong>
                        <span>Updates from your lawyer will appear here, and you can write back any time.</span>
                    </div>`;
                return;
            }

            let html = '';
            let lastDay = '';
            state.items.forEach(item => {
                const dk = dayKey(item.ts);
                if (dk !== lastDay) {
                    html += `<div class="c-day">${escapeHtml(dayLabel(item.ts))}</div>`;
                    lastDay = dk;
                }
                const mine = item.side === 'client';
                const attachment = item.doc
                    ? `<a href="#" class="c-attach" data-doc-path="${escapeHtml(item.doc.file_path || '')}"><i class="fa-solid fa-paperclip"></i> ${escapeHtml(item.doc.title)}</a>`
                    : '';
                const subject = item.subject && item.subject.trim() && item.subject.trim() !== item.body.trim()
                    ? `<span class="c-subject">${escapeHtml(item.subject)}</span>` : '';
                const avatar = mine ? '' : `<span class="p-avatar sm soft" aria-hidden="true">${escapeHtml(initials(c && c.lead_lawyer ? c.lead_lawyer : 'JS'))}</span>`;
                html += `
                    <div class="c-row ${mine ? 'mine' : 'theirs'}">
                        ${avatar}
                        <div class="c-bubble-wrap">
                            ${mine ? '' : `<span class="c-who">${escapeHtml(lawyerLabel)}</span>`}
                            <div class="c-bubble">${subject}${escapeHtml(item.body)}${attachment}</div>
                            <span class="c-time">${escapeHtml(formatTime(item.ts))}</span>
                        </div>
                    </div>`;
            });
            threadEl.innerHTML = html;

            if (scrollToEnd) threadEl.scrollTop = threadEl.scrollHeight;
        }

        function renderFooter() {
            const footer = document.getElementById('c-footer');
            if (!footer) return;
            const c = activeCase();

            if (c && c.status === 'closed') {
                footer.innerHTML = `<div class="c-note"><i class="fa-solid fa-lock"></i> This case is closed, so new messages are turned off.</div>`;
                return;
            }

            const target = c && c.lead_lawyer ? `Atty. ${escapeHtml(c.lead_lawyer)}` : 'your lawyer';
            footer.innerHTML = `
                <div class="c-composer">
                    <form class="c-form" id="c-form" autocomplete="off">
                        <textarea class="c-input" id="c-input" rows="1" maxlength="${MAX_MESSAGE_LENGTH}" placeholder="Write a message to ${target}" aria-label="Message"></textarea>
                        <button type="submit" class="c-send" id="c-send" aria-label="Send message" disabled><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                    <div class="c-formerr" id="c-formerr" role="alert"></div>
                    <div class="c-hint"><span>Enter to send, Shift+Enter for a new line</span><span id="c-count"></span></div>
                </div>`;

            const input = document.getElementById('c-input');
            const sendBtn = document.getElementById('c-send');
            const count = document.getElementById('c-count');

            const sync = () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 140) + 'px';
                const len = input.value.length;
                sendBtn.disabled = input.value.trim().length === 0;
                const left = MAX_MESSAGE_LENGTH - len;
                count.textContent = left <= 200 ? left + ' characters left' : '';
                count.className = left <= 50 ? 'warn' : '';
            };

            input.addEventListener('input', sync);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    if (!sendBtn.disabled) document.getElementById('c-form').requestSubmit();
                }
            });

            document.getElementById('c-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const body = input.value.trim();
                if (!body || body.length > MAX_MESSAGE_LENGTH) return;
                const caseId = state.activeId;
                const errEl = document.getElementById('c-formerr');
                errEl.textContent = '';
                sendBtn.disabled = true;
                input.disabled = true;

                const { data, error } = await supabaseClient.rpc('portal_send_message', { p_case_id: caseId, p_body: body });

                input.disabled = false;

                if (error || !data) {
                    const raw = String((error && (error.message + ' ' + (error.code || ''))) || '');
                    if (/PGRST202|could not find the function/i.test(raw)) {
                        errEl.textContent = 'Messaging is not available yet. Please contact your lawyer directly.';
                    } else if (/too quickly/i.test(raw)) {
                        errEl.textContent = 'You are sending messages too quickly. Please wait a moment.';
                    } else if (/closed/i.test(raw)) {
                        errEl.textContent = 'This case is closed, so new messages are turned off.';
                    } else {
                        errEl.textContent = 'Your message was not sent. Please try again.';
                    }
                    sendBtn.disabled = false;
                    input.focus();
                    return;
                }

                if (String(caseId) === String(state.activeId)) {
                    state.items.push({ key: 'e' + data.id, side: 'client', ts: data.created_at, subject: '', body: data.body, doc: null });
                    state.signature = state.items.map(i => i.key).join('|');
                    renderThread(true);
                }
                input.value = '';
                sync();
                input.focus();
            });

            sync();
        }

        document.getElementById('portal-logout-btn').addEventListener('click', async () => {
            clearInterval(state.pollTimer);
            await supabaseClient.auth.signOut();
            window.location.href = 'client-login.html';
        });

        init();
    </script>
</body>
</html>
